name: Build e Deploy

on:
  push:
    branches: [main]
    paths:
      - 'fonte/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/inline-build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fonte/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: cd fonte && npm ci

      - name: Build Vite (pages)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: cd fonte && npx vite build --mode pages --base /metodorota/

      - name: Gerar index.html e 404.html inline
        run: |
          python3 scripts/inline-build.py fonte/dist-pages/ index.html
          cp index.html 404.html

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no index.html"
          else
            git commit -m "build: atualizar index.html [skip ci]"
            git push
          fi
